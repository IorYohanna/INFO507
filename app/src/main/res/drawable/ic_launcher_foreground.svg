<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">FridgeMate app icon</title>
  <desc id="desc">A clean white refrigerator with a fresh green leaf and cool blue details on a deep teal background.</desc>
  <defs>
    <linearGradient id="bg" x1="62" y1="38" x2="462" y2="484" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#18B6A4"/>
      <stop offset="1" stop-color="#087E83"/>
    </linearGradient>
    <linearGradient id="fridge" x1="159" y1="96" x2="355" y2="421" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E9F5F4"/>
    </linearGradient>
    <linearGradient id="doorShade" x1="188" y1="110" x2="324" y2="220" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F7FFFF"/>
      <stop offset="1" stop-color="#E2F2F0"/>
    </linearGradient>
    <filter id="shadow" x="108" y="66" width="296" height="405" color-interpolation-filters="sRGB" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
  </defs>

  <!-- App tile -->
  <rect width="512" height="512" rx="116" fill="url(#bg)"/>
  <circle cx="420" cy="93" r="70" fill="#FFFFFF" opacity=".055"/>
  <circle cx="91" cy="420" r="92" fill="#002F39" opacity=".08"/>
  <path d="M110 162C128 122 165 91 209 78" fill="none" stroke="#B8FFF0" stroke-width="5" stroke-linecap="round" opacity=".18"/>

  <!-- Soft grounding shadow -->
  <rect x="145" y="91" width="222" height="338" rx="30" fill="#003E49" opacity=".26" filter="url(#shadow)"/>

  <!-- Refrigerator body -->
  <rect x="151" y="79" width="210" height="353" rx="30" fill="url(#fridge)"/>
  <path d="M181 79H331C347.569 79 361 92.431 361 109V228H151V109C151 92.431 164.431 79 181 79Z" fill="url(#doorShade)"/>
  <path d="M151 229H361V402C361 418.569 347.569 432 331 432H181C164.431 432 151 418.569 151 402V229Z" fill="#F2FAF9"/>
  <path d="M151 229H361" stroke="#C8DEDD" stroke-width="5"/>
  <path d="M169 106C169 95 178 87 190 87H321" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" opacity=".8"/>

  <!-- Handles -->
  <rect x="329" y="127" width="10" height="66" rx="5" fill="#82AAA9"/>
  <rect x="329" y="267" width="10" height="85" rx="5" fill="#82AAA9"/>
  <path d="M331 133V187M331 274V345" stroke="#D7E9E8" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Little snow / coolness mark -->
  <g transform="translate(208 148)" stroke="#27AAA5" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M0 -21V21M-18 -10L18 10M-18 10L18 -10"/>
    <path d="M0 -21L-5 -15M0 -21L5 -15M0 21L-5 15M0 21L5 15M-18 -10L-10 -10M-18 -10L-14 -3M18 10L10 10M18 10L14 3M-18 10L-10 10M-18 10L-14 3M18 -10L10 -10M18 -10L14 -3" stroke-width="3.5"/>
  </g>

  <!-- Friendly fresh leaf on lower door -->
  <g transform="translate(244 321)">
    <path d="M-34 20C-39 -13 -15 -42 26 -39C34 -7 15 25 -16 28C-22 28 -29 25 -34 20Z" fill="#42C883"/>
    <path d="M-29 30C-13 11 2 -4 22 -25" fill="none" stroke="#167D63" stroke-width="5" stroke-linecap="round"/>
    <path d="M-14 13L-17 -5M2 -3L17 0" fill="none" stroke="#167D63" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- Two subtle feet make the silhouette feel grounded -->
  <path d="M188 432V442C188 447 192 451 197 451H217V432M295 432V451H315C320 451 324 447 324 442V432" fill="#D8E9E8"/>
  <path d="M191 441H214M298 441H321" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" opacity=".8"/>
</svg>
